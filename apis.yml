apis:
- name: FirstLook External API
  description: >-
    Public external REST API for FirstLook, Pragma's playtest and community
    platform. Uses scoped API tokens to query players, look up or find-or-create a
    player, record analytics events (sessions, counters, durations), list and
    export surveys, and search creators / read the creator leaderboard. Endpoint
    detail is published as an interactive Swagger UI.
  humanURL: https://docs.firstlook.gg/developers/api/
