aid: pragma
name: Pragma
description: >-
  Pragma is a backend infrastructure company for game developers, used by more
  than half of top PC and console studios (including studios such as Bungie, EA,
  and Remedy) to launch and operate live games. The Pragma Platform provides a
  game backend engine (game loops, player data, live operations, telemetry, and
  admin dashboards), plus social and commerce services (cross-platform
  authentication with Steam, Discord, Twitch, PlayStation, Xbox and more, virtual
  currency, entitlements, and order management). Pragma Connect packages these as
  a suite of backend tools for Unreal and Unity. Pragma also operates FirstLook, a
  playtest and community-management platform that runs onboarding, key management,
  surveys, rewards, creator programs, and player analytics — and exposes a public
  external REST API (scoped API tokens), Unity/Unreal SDKs, and a hosted MCP server
  for AI assistants. Added to the API Evangelist network from VC-portfolio signal
  (Greylock, Insight Partners) and enriched from Pragma's public developer surface.
